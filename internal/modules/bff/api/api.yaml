# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/OpenAPI-Specification/refs/heads/main/_archive_/schemas/v3.0/schema.yaml
openapi: "3.0.0"
info:
  version: 1.0.0
  title: Hive BFF Api
tags:
  - name: webauthn
    description: Passkey registration and login
  - name: auth
    description: Session
  - name: users
    description: User management
  - name: repositories
    description: Git repositories the system deploys from

# Every operation requires a session unless it sets `security: []`;
# the server enforces the same public list (server.publicPaths).
# Roles, 403 otherwise: GET is open to every role, other methods need admin (server.RequireSession);
# /users operations need the owner (Users use case); the Repos use case repeats the role checks.
security:
  - cookieAuth: []

# Adding an endpoint:
#   1. add a path with a tag, operationId and `default: $ref Error`
#   2. put request/response bodies in components/schemas, reference them
#   3. reuse components/responses and components/parameters where possible
#   4. public endpoints: `security: []` here and an entry in server.publicPaths
paths:
  /webauthn/register/start:
    post:
      tags: [webauthn]
      operationId: CreateChallenge
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Username"
      responses:
        "200":
          $ref: "#/components/responses/WebauthnChallenge"
        default:
          $ref: "#/components/responses/Error"
  /webauthn/register/finish:
    post:
      tags: [webauthn]
      operationId: CreateChallengeResponse
      security: []
      description: |
        Creates the user. The first user is active and signed in (session cookie set);
        later users await approval by an active user and get no session.
      requestBody:
        $ref: "#/components/requestBodies/WebauthnAttestation"
      responses:
        "200":
          $ref: "#/components/responses/Registration"
        default:
          $ref: "#/components/responses/Error"
  /webauthn/login/start:
    post:
      tags: [webauthn]
      operationId: LoginChallenge
      security: []
      description: Usernameless login; the browser offers the user's discoverable passkeys.
      responses:
        "200":
          $ref: "#/components/responses/WebauthnChallenge"
        default:
          $ref: "#/components/responses/Error"
  /webauthn/login/finish:
    post:
      tags: [webauthn]
      operationId: LoginChallengeResponse
      security: []
      description: Sets the session cookie; 403 if the user awaits approval or is disabled.
      requestBody:
        $ref: "#/components/requestBodies/WebauthnAssertion"
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        default:
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      tags: [auth]
      operationId: GetSession
      description: The signed-in user; 401 without a valid session.
      responses:
        "200":
          $ref: "#/components/responses/SessionUser"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags: [auth]
      operationId: Logout
      security: []
      description: Ends the session, if any, and clears the cookie.
      responses:
        "204":
          $ref: "#/components/responses/Empty"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      tags: [users]
      operationId: ListUsers
      description: Owner only.
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/enable:
    post:
      tags: [users]
      operationId: EnableUser
      description: Owner only. Approves a pending user or re-enables a disabled one, as a user.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          $ref: "#/components/responses/Empty"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/disable:
    post:
      tags: [users]
      operationId: DisableUser
      description: Owner only. Disables the user, demotes them to user and ends their sessions; not the owner themselves.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          $ref: "#/components/responses/Empty"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/role:
    post:
      tags: [users]
      operationId: SetUserRole
      description: |
        Owner only. Makes an active user an admin or a user (409 if pending or disabled);
        owner is not assignable and the owner cannot change their own role.
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "204":
          $ref: "#/components/responses/Empty"
        default:
          $ref: "#/components/responses/Error"
  /repositories:
    get:
      tags: [repositories]
      operationId: ListRepositories
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Repositories"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [repositories]
      operationId: CreateRepository
      description: |
        Admin. Connects to the repository with the credentials first;
        400 repo_access_denied or repo_unreachable if that fails, 409 if the URL is taken.
      requestBody:
        $ref: "#/components/requestBodies/RepositoryInput"
      responses:
        "201":
          $ref: "#/components/responses/Repository"
        default:
          $ref: "#/components/responses/Error"
  /repositories/{id}:
    get:
      tags: [repositories]
      operationId: GetRepository
      parameters:
        - $ref: "#/components/parameters/RepositoryID"
      responses:
        "200":
          $ref: "#/components/responses/Repository"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [repositories]
      operationId: UpdateRepository
      description: |
        Admin. Replaces the repository and checks the connection like create.
        An omitted password or sshPrivateKey keeps the stored one, "" clears it;
        changing the URL requires sending the secrets again (400 repo_credentials_required).
      parameters:
        - $ref: "#/components/parameters/RepositoryID"
      requestBody:
        $ref: "#/components/requestBodies/RepositoryInput"
      responses:
        "200":
          $ref: "#/components/responses/Repository"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [repositories]
      operationId: DeleteRepository
      description: Admin.
      parameters:
        - $ref: "#/components/parameters/RepositoryID"
      responses:
        "204":
          $ref: "#/components/responses/Empty"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    # Opaque random token set HttpOnly by register/login finish; the server stores only its hash.
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: UUID
    RepositoryID:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: UUID
    Cursor:
      name: cursor
      in: query
      required: false
      description: nextCursor or previousCursor of a page; omit for the first page.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    UsernameRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: Case-insensitive, stored lowercase.
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{2,63}$"
    RegistrationResult:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, pending_approval]
    Role:
      type: string
      description: owner manages users, admin reads and writes, user only reads.
      enum: [owner, admin, user]
    RoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/Role"
    SessionUser:
      type: object
      required:
        - id
        - username
        - role
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    User:
      type: object
      required:
        - id
        - username
        - role
        - disabled
        - createdAt
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
          description: Awaiting approval or disabled.
        createdAt:
          type: string
          format: date-time
    UsersPage:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          type: string
          description: Pass as `cursor` for the next page; absent on the last page.
        previousCursor:
          type: string
          description: Pass as `cursor` for the previous page; absent on the first page.
    Repository:
      type: object
      description: Secrets are never returned; hasPassword and hasSshPrivateKey tell whether they are set.
      required:
        - id
        - name
        - url
        - username
        - insecure
        - hasPassword
        - hasSshPrivateKey
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        username:
          type: string
        insecure:
          type: boolean
        hasPassword:
          type: boolean
        hasSshPrivateKey:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RepositoryInput:
      type: object
      description: |
        The URL decides the auth: https://host/path takes an optional username and password (or token),
        ssh://[user@]host[:port]/path or user@host:path takes an SSH private key. URLs carry no credentials.
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 2048
        name:
          type: string
          maxLength: 255
        username:
          type: string
        password:
          type: string
          description: Password or token; omit on update to keep the stored one, "" to clear it.
        sshPrivateKey:
          type: string
          description: Unencrypted PEM/OpenSSH private key; omit on update to keep the stored one, "" to clear it.
        insecure:
          type: boolean
          description: Skip TLS verification (https) or host key verification (ssh).
    RepositoriesPage:
      type: object
      required:
        - repositories
      properties:
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        nextCursor:
          type: string
          description: Pass as `cursor` for the next page; absent on the last page.
        previousCursor:
          type: string
          description: Pass as `cursor` for the previous page; absent on the first page.
    # Opaque on purpose: the WebAuthn JSON shapes are defined by the W3C spec
    # and parsed by go-webauthn, not by this API.
    WebauthnChallenge:
      type: object
    WebauthnAttestation:
      type: object
    WebauthnAssertion:
      type: object
  requestBodies:
    Username:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UsernameRequest"
    WebauthnAttestation:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebauthnAttestation"
    WebauthnAssertion:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebauthnAssertion"
    RepositoryInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepositoryInput"
  responses:
    Empty:
      description: Success
    WebauthnChallenge:
      description: Challenge
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebauthnChallenge"
    Registration:
      description: Registration result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegistrationResult"
    SessionUser:
      description: Signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionUser"
    Users:
      description: Up to 10 users, oldest first
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UsersPage"
    Repository:
      description: Repository
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Repository"
    Repositories:
      description: Up to 10 repositories, oldest first
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepositoriesPage"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
