#:schema https://json.schemastore.org/any.json
root = "/app"
env_files = [".env"]

[build]
cmd = "go build -race -o /app/tmp/${MODULE_NAME} cmd/${MODULE_NAME}/main.go"
bin = "/app/tmp/${MODULE_NAME}"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor", "node_modules", "migrations", "web"]
# Exclude specific regular expressions.
exclude_regex = ["_test\\.go"]
delay = 1000
clear = true

[log]
time = true